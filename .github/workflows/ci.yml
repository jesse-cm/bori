name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos:
    name: macOS — full build and tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift build
      - run: swift test

  windows:
    # Builds the whole package — including the BoriWindows tray app —
    # and runs the engine and hosts-file tests. The macOS-only layers
    # (AppKit shell, AppleScript sweep, XPC helper) compile out.
    name: Windows — build and tests
    runs-on: windows-latest
    steps:
      - uses: compnerd/gha-setup-swift@v0.4.0
        with:
          branch: swift-6.2-release
          tag: 6.2-RELEASE
      - uses: actions/checkout@v4
      - run: swift build
      - run: swift test
